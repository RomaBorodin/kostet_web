version: '3'

services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        environment:
            - DATABASE_HOST=db
            - DATABASE_PORT=3306
            - DATABASE_NAME=lab_db
            - DATABASE_USER=lab_user
            - DATABASE_PASSWORD=12345
        depends_on:
            - db
        networks:
            custom_network:
                ipv4_address: 172.20.0.22

    db:
        image: mariadb
        environment:
            MYSQL_DATABASE: lab_db
            MYSQL_USER: lab_user
            MYSQL_PASSWORD: "12345"
            MYSQL_ROOT_PASSWORD: kali
        volumes:
            - db_data:/var/lib/mysql
        networks:
            custom_network:
                ipv4_address: 172.20.0.23

volumes:
    db_data: {}

networks:
    custom_network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16

